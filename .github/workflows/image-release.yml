name: Image release

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: image-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged commit
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_NAMESPACE: ${{ vars.DOCKER_NAMESPACE }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REPO: ${{ vars.DOCKER_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate registry settings and image tag
        id: image
        run: |
          for name in DOCKER_REGISTRY DOCKER_NAMESPACE DOCKER_REPO DOCKER_USERNAME DOCKER_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          if [[ "$DOCKER_REGISTRY" == *://* || "$DOCKER_REGISTRY" == */* ]]; then
            echo "::error::DOCKER_REGISTRY must be a registry host, optionally with a port"
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::The Git tag must be a valid Docker tag, for example v0.1.0 or v0.2.0-rc.1"
            exit 1
          fi
          printf 'ref=%s/%s/%s:%s\n' \
            "$DOCKER_REGISTRY" "$DOCKER_NAMESPACE" "$DOCKER_REPO" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Aliyun ACR rejects BuildKit's OCI attestation artifact format.
          provenance: false
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=clueops-image
          cache-to: type=gha,mode=max,scope=clueops-image
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
